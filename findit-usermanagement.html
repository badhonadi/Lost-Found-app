<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FindIT Admin — User Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="config.js"></script>
<style>
/* ════════════════════════════════
   RESET
════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
button,input,select,textarea{font-family:inherit;}
html,body{height:100%;overflow:hidden;}

/* ════════════════════════════════
   TOKENS — dark
════════════════════════════════ */
:root{
  --bg:        #0B0F1A;
  --card:      #141928;
  --sidebar:   #0D1120;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.04);
  --primary:   #6B8AFF;
  --primary-d: rgba(107,138,255,0.14);
  --primary-g: rgba(107,138,255,0.26);
  --accent:    #00D4AA;
  --fg:        #E8EAF6;
  --muted:     #8B93A9;
  --muted-bg:  rgba(255,255,255,0.055);
  --muted-bg2: rgba(255,255,255,0.035);
  --danger:    #EF4444;
  --danger-d:  rgba(239,68,68,0.12);
  --amber:     #F59E0B;
  --amber-d:   rgba(245,158,11,0.13);
  --green:     #4ade80;
  --green-d:   rgba(74,222,128,0.11);
  --violet:    #A78BFA;
  --violet-d:  rgba(167,139,250,0.12);
  --radius:    16px;
  --font-h:    'Plus Jakarta Sans',sans-serif;
  --font-b:    'Inter',sans-serif;
  --font-m:    'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:        #EEF0F8;
  --card:      #FFFFFF;
  --sidebar:   #0D1120;
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.04);
  --primary:   #4F6EF7;
  --primary-d: rgba(79,110,247,0.10);
  --primary-g: rgba(79,110,247,0.20);
  --accent:    #00C49F;
  --fg:        #0D1120;
  --muted:     #6B7280;
  --muted-bg:  rgba(0,0,0,0.05);
  --muted-bg2: rgba(0,0,0,0.03);
  --danger-d:  rgba(239,68,68,0.09);
  --amber-d:   rgba(245,158,11,0.09);
  --green-d:   rgba(74,222,128,0.08);
  --violet-d:  rgba(167,139,250,0.09);
}

/* ════════════════════════════════
   LAYOUT
════════════════════════════════ */
body{font-family:var(--font-b);background:var(--bg);color:var(--fg);font-size:14px;display:flex;}
.shell{display:flex;height:100vh;width:100%;}

/* ════════════════════════════════
   SIDEBAR
════════════════════════════════ */
.sidebar{
  width:232px;height:100vh;display:flex;flex-direction:column;
  background:var(--sidebar);border-right:1px solid rgba(255,255,255,.05);
  flex-shrink:0;transition:width .25s ease;overflow:hidden;z-index:10;
}
.sidebar.collapsed{width:64px;}
.sidebar-header{
  height:56px;display:flex;align-items:center;padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;gap:10px;
}
.logo-mark{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#6B8AFF 0%,#4F6EF7 55%,#00D4AA 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(107,138,255,.38);
}
.logo-mark svg{width:16px;height:16px;}
.logo-text{overflow:hidden;white-space:nowrap;}
.logo-name{font-family:var(--font-h);font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;display:block;}
.logo-sub{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);display:block;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none;}
.sidebar-nav::-webkit-scrollbar{display:none;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;
  font-size:12px;font-weight:500;color:rgba(255,255,255,.4);
  cursor:pointer;border:1px solid transparent;transition:all .15s;
  background:none;width:100%;text-align:left;white-space:nowrap;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;color:rgba(255,255,255,.3);transition:color .15s;}
.nav-item:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.04);}
.nav-item:hover svg{color:rgba(255,255,255,.55);}
.nav-item.active{background:rgba(107,138,255,.13);color:#9BAEFF;border-color:rgba(107,138,255,.22);}
.nav-item.active svg{color:#6B8AFF;}
.nav-label{overflow:hidden;}
.sidebar.collapsed .nav-label{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.05);}
.logout-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid rgba(239,68,68,.18);border-radius:8px;background:rgba(239,68,68,.08);color:#f87171;cursor:pointer;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(239,68,68,.15);}
.logout-btn svg{width:14px;height:14px;flex-shrink:0;}
.sidebar.collapsed .logout-btn{justify-content:center;padding:10px;}
.sidebar.collapsed .logout-label{display:none;}
.collapse-btn{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:7px 10px;
  border-radius:8px;border:none;background:none;color:rgba(255,255,255,.28);
  cursor:pointer;width:100%;font-size:11px;font-weight:500;transition:all .15s;
}
.collapse-btn:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);}
.sidebar.collapsed .collapse-btn{justify-content:center;}
.collapse-btn svg{width:14px;height:14px;flex-shrink:0;transition:transform .25s;}
.sidebar.collapsed .collapse-btn svg{transform:rotate(180deg);}
.sidebar.collapsed .collapse-label{display:none;}

/* ════════════════════════════════
   MAIN
════════════════════════════════ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

/* TOP BAR */
.topbar{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(20px);position:sticky;top:0;z-index:9;flex-shrink:0;
}
.topbar-left h2{font-family:var(--font-h);font-size:13px;font-weight:700;color:var(--fg);}
.topbar-left p{font-size:10px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.search-wrap{position:relative;}
.search-wrap input{
  padding:6px 12px 6px 32px;border-radius:10px;font-size:11px;
  background:var(--muted-bg);border:1px solid var(--border);color:var(--fg);
  width:180px;outline:none;transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--primary);}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:var(--muted);}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--muted-bg);color:var(--fg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;
}
.icon-btn:hover{background:var(--muted-bg2);}
.icon-btn svg{width:14px;height:14px;}
.notif-badge-dot{
  position:absolute;top:-3px;right:-3px;width:8px;height:8px;
  border-radius:50%;background:#EF4444;border:2px solid var(--bg);
}
.lang-btn{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--muted-bg);color:var(--fg);
  font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.lang-btn:hover{background:var(--muted-bg2);}
.avatar-pill{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#6B8AFF,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;flex-shrink:0;
}

/* ════════════════════════════════
   CONTENT AREA
════════════════════════════════ */
.content-wrap{flex:1;display:flex;overflow:hidden;}

/* LEFT PANEL — user list */
.user-panel{
  flex:1;min-width:0;overflow-y:auto;padding:20px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.user-panel::-webkit-scrollbar{width:4px;}
.user-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* RIGHT PANEL — detail */
.detail-panel{
  width:360px;flex-shrink:0;overflow-y:auto;padding:20px;
  border-left:1px solid var(--border);
  background:color-mix(in srgb,var(--card) 70%,transparent);
  scrollbar-width:none;
}
.detail-panel::-webkit-scrollbar{display:none;}
.detail-panel.hidden{display:none;}
@media(max-width:1000px){.detail-panel{width:300px;}}

/* ════════════════════════════════
   STAT ROW
════════════════════════════════ */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
.stat-mini{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;cursor:default;
}
.stat-mini-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.stat-mini-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.stat-mini-icon svg{width:12px;height:12px;}
.stat-mini-val{font-family:var(--font-h);font-size:20px;font-weight:800;color:var(--fg);line-height:1;}
.stat-mini-label{font-size:10px;color:var(--muted);margin-top:3px;}
.stat-mini-trend{font-size:9px;font-weight:700;}
.up{color:#4ade80;} .dn{color:#f87171;} .neu{color:var(--muted);}

/* ════════════════════════════════
   TOOLBAR
════════════════════════════════ */
.toolbar{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.tool-search{position:relative;flex:1;min-width:180px;}
.tool-search input{
  width:100%;padding:8px 12px 8px 34px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);color:var(--fg);
  font-size:12px;outline:none;transition:border-color .15s;
}
.tool-search input:focus{border-color:var(--primary);}
.tool-search input::placeholder{color:var(--muted);}
.tool-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);}
.filter-select{
  padding:7px 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);font-size:11px;outline:none;cursor:pointer;
}
.filter-select option{background:var(--card);}
.add-user-btn{
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;
  background:var(--primary-d);border:1px solid rgba(107,138,255,.25);
  color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.add-user-btn:hover{background:var(--primary-g);}
.add-user-btn svg{width:13px;height:13px;}

/* ════════════════════════════════
   TABLE
════════════════════════════════ */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-head{
  display:grid;
  grid-template-columns:32px 1fr 1fr 110px 96px 80px;
  gap:0;padding:10px 16px;border-bottom:1px solid var(--border);
}
.th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:4px;}
.th svg{width:10px;height:10px;cursor:pointer;}
.table-body{display:flex;flex-direction:column;}
.table-row{
  display:grid;
  grid-template-columns:32px 1fr 1fr 110px 96px 80px;
  gap:0;padding:10px 16px;border-bottom:1px solid var(--border2);
  cursor:pointer;transition:background .12s;align-items:center;
}
.table-row:last-child{border-bottom:none;}
.table-row:hover{background:var(--muted-bg);}
.table-row.selected{background:var(--primary-d);border-left:3px solid var(--primary);}
.table-row.selected:hover{background:var(--primary-g);}

.row-check{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);
  background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.row-check.checked{background:var(--primary);border-color:var(--primary);}
.row-check.checked::after{content:'✓';font-size:9px;color:#fff;font-weight:700;}

.user-cell{display:flex;align-items:center;gap:10px;min-width:0;}
.user-av{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;
}
.user-cell-info{min-width:0;}
.user-cell-name{font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-cell-id{font-size:10px;color:var(--muted);font-family:var(--font-m);}

.td{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;overflow:hidden;}
.td-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.role-chip{font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.role-admin{background:rgba(107,138,255,.16);color:#6B8AFF;}
.role-moderator{background:rgba(167,139,250,.14);color:#A78BFA;}
.role-user{background:rgba(139,147,169,.12);color:#8B93A9;}

.status-chip{font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;}
.s-active{background:rgba(74,222,128,.12);color:#4ade80;}
.s-suspended{background:rgba(245,158,11,.14);color:#F59E0B;}
.s-banned{background:rgba(239,68,68,.13);color:#EF4444;}
.s-pending{background:rgba(107,138,255,.14);color:#6B8AFF;}

.row-actions{display:flex;align-items:center;gap:4px;}
.row-btn{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--border);
  background:var(--muted-bg);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.row-btn:hover{background:var(--primary-d);border-color:rgba(107,138,255,.22);color:var(--primary);}
.row-btn svg{width:11px;height:11px;}

/* pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);}
.page-info{font-size:11px;color:var(--muted);}
.page-btns{display:flex;gap:4px;}
.page-btn{
  width:28px;height:28px;border-radius:7px;border:1px solid var(--border);
  background:var(--muted-bg);color:var(--fg);font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.page-btn:hover{background:var(--primary-d);border-color:rgba(107,138,255,.22);color:var(--primary);}
.page-btn.active{background:var(--primary-d);border-color:rgba(107,138,255,.28);color:var(--primary);font-weight:700;}
.page-btn svg{width:11px;height:11px;}

/* ════════════════════════════════
   DETAIL PANEL
════════════════════════════════ */
.dp-close{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
}
.dp-close-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:var(--muted-bg);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.dp-close-btn:hover{background:var(--muted-bg2);}
.dp-close-btn svg{width:13px;height:13px;}
.dp-close-label{font-size:11px;font-weight:700;color:var(--muted);}

.dp-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;}
.dp-avatar{
  width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff;position:relative;
}
.dp-avatar-badge{
  position:absolute;bottom:-4px;right:-4px;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--card);
}
.dp-avatar-badge svg{width:9px;height:9px;}
.dp-name{font-family:var(--font-h);font-size:16px;font-weight:800;color:var(--fg);text-align:center;}
.dp-id{font-family:var(--font-m);font-size:10px;color:var(--muted);text-align:center;}

.dp-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.dp-chip{font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;}

.dp-section{margin-bottom:18px;}
.dp-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
.dp-info-grid{display:flex;flex-direction:column;gap:6px;}
.dp-info-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:9px;background:var(--muted-bg);
}
.dp-info-key{font-size:10px;color:var(--muted);white-space:nowrap;}
.dp-info-val{font-size:11px;font-weight:600;color:var(--fg);text-align:right;word-break:break-all;}
.dp-info-val.mono{font-family:var(--font-m);font-size:10px;}

/* action buttons */
.dp-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.action-btn{
  width:100%;padding:10px 14px;border-radius:11px;font-size:12px;font-weight:700;
  cursor:pointer;border:1px solid;display:flex;align-items:center;gap:8px;
  transition:all .15s;text-align:left;
}
.action-btn svg{width:14px;height:14px;flex-shrink:0;}
.action-btn .btn-label{flex:1;}
.action-btn .btn-sub{font-size:10px;font-weight:400;opacity:.7;}
.btn-approve{
  background:var(--green-d);border-color:rgba(74,222,128,.2);color:#4ade80;
}
.btn-approve:hover{background:rgba(74,222,128,.18);}
.btn-suspend{
  background:var(--amber-d);border-color:rgba(245,158,11,.22);color:#F59E0B;
}
.btn-suspend:hover{background:rgba(245,158,11,.2);}
.btn-ban{
  background:var(--danger-d);border-color:rgba(239,68,68,.2);color:#EF4444;
}
.btn-ban:hover{background:rgba(239,68,68,.18);}
.btn-reset{
  background:var(--violet-d);border-color:rgba(167,139,250,.2);color:#A78BFA;
}
.btn-reset:hover{background:rgba(167,139,250,.18);}
.btn-notif{
  background:var(--primary-d);border-color:rgba(107,138,255,.22);color:var(--primary);
}
.btn-notif:hover{background:var(--primary-g);}
.btn-view{
  background:var(--muted-bg);border-color:var(--border);color:var(--muted);
}
.btn-view:hover{background:var(--muted-bg2);}

/* activity mini */
.dp-activity{display:flex;flex-direction:column;gap:8px;}
.dp-act-item{display:flex;align-items:flex-start;gap:8px;}
.dp-act-dot{
  width:24px;height:24px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.dp-act-dot svg{width:10px;height:10px;}
.dp-act-text{font-size:11px;color:var(--fg);line-height:1.35;}
.dp-act-time{font-size:10px;color:var(--muted);margin-top:1px;}

/* toast */
.toast-wrap{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;
  border:1px solid;font-size:12px;font-weight:600;
  box-shadow:0 12px 40px rgba(0,0,0,.35);pointer-events:all;
  animation:slideUp .22s ease;min-width:260px;max-width:320px;
}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.toast svg{width:14px;height:14px;flex-shrink:0;}
.toast.success{background:rgba(74,222,128,.11);border-color:rgba(74,222,128,.22);color:#4ade80;}
.toast.warning{background:rgba(245,158,11,.11);border-color:rgba(245,158,11,.22);color:#F59E0B;}
.toast.danger{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#EF4444;}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  z-index:9990;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:28px;width:420px;max-width:94vw;box-shadow:0 24px 80px rgba(0,0,0,.5);

}

.modal-title{font-family:var(--font-h);font-size:17px;font-weight:800;color:var(--fg);text-align:center;margin-bottom:6px;}
.modal-sub{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:20px;}
.modal-textarea{

.modal-btns{display:flex;gap:10px;}
.modal-btn-cancel{

}
.modal-btn-cancel:hover{background:var(--muted-bg2);}
.modal-btn-confirm{

async function fetchUsersFromDB() {
  try {
    const baseUrl = window.API_BASE_URL || '';
    const res = await fetch(`${baseUrl}/api/admin/users`);
    const data = await res.json();
    if (data && Array.isArray(data.users)) {
      // Exclude admin user from User Management list
      users = data.users.filter(u => u.email !== 'admin@gmail.com' && u.role !== 'admin');
      renderStats();
      renderTable();
      if (selectedId) renderDetail();
    }
  } catch (err) {
    console.error('Error fetching users from MongoDB:', err);
  }
}

function setDate(){

      <span class="nav-label">${lang==='en'?n.label:n.label_bn}</span>
    </button>`).join('');
}

function goPage(key){
  if (key === 'dashboard') window.location.href = 'findit_dashboard.html';

  else if (key === 'reports') window.location.href = 'findit_reports.html';

  else if (key === 'map') window.location.href = 'findit_map.html';

}

/* ═══════════════════════════
   TABLE
═══════════════════════════ */
function getFiltered(){
  const q=(document.getElementById('main-search')||document.getElementById('top-search')).value.toLowerCase();
  const sf=document.getElementById('status-filter').value;
  const rf=document.getElementById('role-filter').value;
  return users.filter(u=>{
    const match=!q||(u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.phone.includes(q)||u.id.toLowerCase().includes(q));
    const statusMatch=sf==='all'||u.status===sf;
    const roleMatch=rf==='all'||u.role===rf;
    return match&&statusMatch&&roleMatch;
  });
}

function filterUsers(){
  currentPage=1; renderTable();
}

function renderTable(){
  const filtered=getFiltered();
  const total=filtered.length;
  const start=(currentPage-1)*pageSize;
  const paged=filtered.slice(start,start+pageSize);

  const tbody=document.getElementById('table-body');
  if(!paged.length){
    tbody.innerHTML=`<div style="padding:40px;text-align:center;color:var(--muted);font-size:12px;">No users found.</div>`;
  } else {
    tbody.innerHTML=paged.map(u=>rowHTML(u)).join('');
  }

  document.getElementById('page-info').textContent=
    `Showing ${Math.min(start+1,total)}–${Math.min(start+pageSize,total)} of ${total}`;
  renderPager(total);
}

function quickAction(id, type){
  const u=users.find(u=>u.id===id);
  if(!u) return;
  if(type==='suspend'){
    if(u.status==='suspended'){
      updateStatus(id,'active'); showToast('Account reactivated','success');
    } else {
      updateStatus(id,'suspended'); showToast(`${u.name} suspended`,'warning');
    }
  } else if(type==='delete'){
    showConfirmModal({
      icon:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>',
      iconBg:'rgba(239,68,68,.12)',iconCol:'#EF4444',
      title:'Remove User',
      sub:`Are you sure you want to remove <strong>${u.name}</strong> from MongoDB? This action cannot be undone.`,
      confirmLabel:'Remove',confirmClass:'red',
      onConfirm: async ()=>{
        users=users.filter(userItem=>userItem.id!==id);
        if(selectedId===id) closeDetail();
        renderStats(); renderTable();
        showToast(`${u.name} removed from MongoDB`,'danger');
        try {
          const baseUrl = window.API_BASE_URL || '';
          await fetch(`${baseUrl}/api/admin/users/${id}`, { method: 'DELETE' });
        } catch (e) {
          console.warn('Delete sync error:', e);
        }
      }
    });
  }
}

function renderPager(total){
  const pages=Math.ceil(total/pageSize);
  const wrap=document.getElementById('page-btns');
  let html='';
  html+=`<button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled style="opacity:.35;pointer-events:none;"':''}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>`;
  for(let i=1;i<=pages;i++){
    html+=`<button class="page-btn${i===currentPage?' active':''}" onclick="changePage(${i})">${i}</button>`;
  }
  html+=`<button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===pages?'disabled style="opacity:.35;pointer-events:none;"':''}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>`;
  wrap.innerHTML=html;
}

   ACTIONS
═══════════════════════════ */
async function updateStatus(id,status){
  users=users.map(u=>u.id===id?{...u,status}:u);
  renderStats(); renderTable();
  if(selectedId===id) renderDetail();

  try {
    const baseUrl = window.API_BASE_URL || '';
    await fetch(`${baseUrl}/api/admin/users/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
  } catch (e) {
    console.warn('Could not update status in MongoDB:', e);
  }
}

function doAction(id,type){
  const u=users.find(u=>u.id===id);
  if(!u) return;
  if(type==='activate'){
    updateStatus(id,'active');
    showToast(`${u.name}'s account activated`,'success');
  } else if(type==='suspend'){
    showConfirmModal({
      icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      iconBg:'rgba(245,158,11,.14)',iconCol:'#F59E0B',
      title:'Suspend Account',
      sub:`Suspending <strong>${u.name}</strong> will restrict their access temporarily. They will be notified via email.`,
      confirmLabel:'Suspend',confirmClass:'amber',
      onConfirm:()=>{ updateStatus(id,'suspended'); showToast(`${u.name} suspended`,'warning'); }
    });
  } else if(type==='ban'){
    showConfirmModal({
      icon:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      iconBg:'rgba(239,68,68,.13)',iconCol:'#EF4444',
      title:'Ban User',
      sub:`This will <strong>permanently ban</strong> ${u.name} from FindIT. All their posts will be hidden. This action is severe.`,
      confirmLabel:'Ban Permanently',confirmClass:'red',
      onConfirm:()=>{ updateStatus(id,'banned'); showToast(`${u.name} has been banned`,'danger'); }
    });
  } else if(type==='verify'){
    users=users.map(u=>u.id===id?{...u,verified:true,status:'active'}:u);
    renderStats(); renderTable(); renderDetail();
    showToast(`${u.name} verified successfully`,'success');
    updateStatus(id,'active');
  } else if(type==='reset'){
    showConfirmModal({
      icon:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
      iconBg:'rgba(167,139,250,.14)',iconCol:'#A78BFA',
      title:'Reset Password',
      sub:`A password reset link will be sent to <strong>${u.email}</strong>. The user will be prompted to create a new password.`,
      confirmLabel:'Send Reset Link',confirmClass:'violet',
      onConfirm:()=>{ showToast(`Reset link sent to ${u.email}`,'info'); }
    });
  } else if(type==='notify'){
    showNotifyModal(u);
  }
}

  _onConfirm=onConfirm;
  document.getElementById('modal-container').innerHTML=`

}
function confirmAction(){
  closeModal();

}
function closeModal(){

}

const TOAST_ICONS={
  success:'<polyline points="20 6 9 17 4 12"/>',
  warning:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  danger:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
};
function showToast(msg, type='info'){
  const wrap=document.getElementById('toast-wrap');
  const div=document.createElement('div');
  div.className=`toast ${type}`;
  div.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${TOAST_ICONS[type]}</svg>${msg}`;
  wrap.appendChild(div);
  setTimeout(()=>div.remove(), 3500);
}
</script>
