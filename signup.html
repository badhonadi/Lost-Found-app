<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>FindIt — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F8FAFC;
      --ib:     #F1F5F9;
      --tc:     #0F172A;
      --mc:     #64748B;
      --border: #E2E8F0;
      --primary:#2563EB;
    }
    body.dark {
      --bg:  #0F172A;
      --ib:  #1E293B;
      --tc:  #F1F5F9;
      --mc:  #94A3B8;
      --border:#1E293B;
    }

    body {
      min-height: 100dvh; background: #dfe6ef;
      font-family: 'Inter', sans-serif; color: var(--tc);
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .page {
      width: min(100vw, 430px);
      min-height: 100dvh;
      padding: 0 20px 48px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      margin: 0 auto;
    }

    /* ── Header ── */
    .header { padding-top: 48px; padding-bottom: 16px; }

    .back-btn {
      width: 40px; height: 40px; border-radius: 16px;
      background: var(--ib); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; transition: opacity .15s;
    }
    .back-btn:active { opacity: .7; }

    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #2563EB 0%, #14B8A6 100%);
      box-shadow: 0 4px 14px rgba(37,99,235,.35);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-text {
      font-family: 'Poppins', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--tc);
    }

    .screen-title {
      margin-top: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 24px; font-weight: 700; color: var(--tc);
    }
    .screen-sub { margin-top: 4px; font-size: 14px; color: var(--mc); }

    /* ── Avatar upload ── */
    .avatar-section {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0;
    }

    .avatar-label {
      position: relative; cursor: pointer; display: block;
    }
    .avatar-label input[type=file] { display: none; }

    .avatar-circle {
      width: 80px; height: 80px; border-radius: 50%;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: var(--ib);
      border: 2px dashed var(--mc);
      transition: border-color .2s;
    }
    .avatar-circle.has-image { border: 2px solid transparent; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

    .avatar-plus {
      position: absolute; bottom: -4px; right: -4px;
      width: 28px; height: 28px; border-radius: 50%;
      background: #2563EB;
      display: flex; align-items: center; justify-content: center;
    }

    .upload-label {
      font-size: 12px; font-weight: 600; color: var(--primary);
      margin-top: 8px;
    }

    /* ── Form ── */
    .form { display: flex; flex-direction: column; gap: 16px; }

    .field-label {
      display: block; font-size: 14px; font-weight: 500;
      color: var(--tc); margin-bottom: 6px;
    }

    .input-row {
      display: flex; align-items: center;
      background: var(--ib); border-radius: 16px;
      height: 52px; padding: 0 16px; gap: 12px;
    }
    .input-row input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 14px; color: var(--tc); font-family: 'Inter', sans-serif;
    }
    .input-row input::placeholder { color: var(--mc); }
    .input-row svg { flex-shrink: 0; color: var(--mc); }
    .input-row select {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 14px; color: var(--tc); font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    .input-row select:invalid { color: var(--mc); }

    .eye-btn {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; color: var(--mc);
    }

    /* ── Terms note ── */
    .terms-note {
      font-size: 12px; text-align: center; color: var(--mc);
      padding: 0 8px; line-height: 1.5;
    }
    .terms-note a { color: var(--primary); text-decoration: none; font-weight: 500; }

    /* ── Sign up button ── */
    .btn-signup {
      width: 100%; height: 52px; border-radius: 16px;
      background: linear-gradient(135deg, #2563EB, #14B8A6);
      color: white; font-family: 'Poppins', sans-serif;
      font-size: 15px; font-weight: 600; border: none; cursor: pointer;
      box-shadow: 0 4px 18px rgba(37,99,235,.35);
      transition: transform .15s;
    }
    .btn-signup:active { transform: scale(.97); }

    /* ── Switch link ── */
    .switch-text {
      text-align: center; font-size: 14px; color: var(--mc);
    }
    .switch-text a { color: var(--primary); font-weight: 600; text-decoration: none; }

    .toast {
      position: fixed; top: 20px; left: 50%; z-index: 10;
      width: min(calc(100% - 32px), 398px); padding: 14px 18px;
      border-radius: 14px; color: white; background: #172018;
      box-shadow: 0 8px 24px rgba(15,23,42,.22);
      font-size: 14px; text-align: center;
      transform: translate(-50%, -140%); opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: #991B1B; }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="page">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
        </svg>
      </button>

      <div class="logo-row">
        <div class="logo-mark">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white" fill-opacity=".9"/>
            <circle cx="12" cy="9" r="2.5" fill="#14B8A6"/>
            <circle cx="17.2" cy="17.2" r="2.8" fill="none" stroke="white" stroke-width="1.6"/>
            <line x1="19.2" y1="19.2" x2="21" y2="21" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">FindIt</span>
      </div>

      <h2 class="screen-title">Create Account</h2>
      <p class="screen-sub">Join thousands finding their lost items.</p>
    </div>

    <div class="form">
      <!-- Avatar -->
      <div class="avatar-section">
        <label class="avatar-label">
          <input type="file" accept="image/*" id="avatar-input">
          <div class="avatar-circle" id="avatar-circle">
            <svg id="avatar-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            <img id="avatar-preview" src="" alt="Avatar" style="display:none; width:100%; height:100%; object-fit:cover;">
          </div>
          <div class="avatar-plus">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
        </label>
        <span class="upload-label">Upload Photo</span>
      </div>

      <!-- Full Name -->
      <div>
        <label class="field-label">Full Name</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="full-name" placeholder="John Smith" autocomplete="name">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="field-label">Email Address</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
          </svg>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <!-- Phone -->
      <div>
        <label class="field-label">Phone Number</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.36 12 19.79 19.79 0 0 1 1.27 3.49 2 2 0 0 1 3.24 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input type="tel" id="phone" placeholder="+1 (555) 000-0000" autocomplete="tel">
        </div>
      </div>

      <!-- Gender -->
      <div>
        <label class="field-label" for="gender">Gender</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M5 21c.7-3.3 3.1-5 7-5s6.3 1.7 7 5"/>
          </svg>
          <select id="gender" required>
            <option value="" selected disabled>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
          </select>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="field-label">Password</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="pw1" placeholder="Min. 8 characters" autocomplete="new-password">
          <button class="eye-btn" type="button" data-target="pw1">
            <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="field-label">Confirm Password</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="pw2" placeholder="Re-enter password" autocomplete="new-password">
          <button class="eye-btn" type="button" data-target="pw2">
            <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Terms -->
      <p class="terms-note">
        By creating an account you agree to our
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.
      </p>

      <!-- Sign Up button -->
      <button class="btn-signup" id="signup-button" type="button">Sign Up</button>

      <!-- Switch to login -->
      <p class="switch-text">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script>
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Dark mode
    if (localStorage.getItem('findit_dark') === 'true') document.body.classList.add('dark');

    let avatarData = null;

    // Avatar preview
    document.getElementById('avatar-input').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        avatarData = e.target.result;
        const preview = document.getElementById('avatar-preview');
        const icon    = document.getElementById('avatar-icon');
        const circle  = document.getElementById('avatar-circle');
        preview.src = e.target.result;
        preview.style.display = '';
        icon.style.display = 'none';
        circle.classList.add('has-image');
        circle.style.border = '2px solid transparent';
      };
      reader.readAsDataURL(file);
      this.value = '';
    });

    document.getElementById('signup-button').addEventListener('click', async () => {
      const button = document.getElementById('signup-button');
      const password = document.getElementById('pw1').value;
      const confirmPassword = document.getElementById('pw2').value;
      const payload = {
        fullName: document.getElementById('full-name').value.trim(),
        email: document.getElementById('signup-email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        gender: document.getElementById('gender').value,
        password,
        avatar: avatarData
      };

      if (!payload.fullName || !payload.email || !payload.phone || !payload.gender || !password) {
        showToast('Please complete all required fields.', true);
        return;
      }
      if (password.length < 8 || password !== confirmPassword) {
        showToast(password.length < 8 ? 'Password must be at least 8 characters.' : 'Passwords do not match.', true);
        return;
      }

      button.disabled = true;
      try {
        const baseUrl = window.API_BASE_URL || '';
        const response = await fetch(`${baseUrl}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to create account.');
        const user = result.user;
        localStorage.removeItem('findit_user');
        sessionStorage.removeItem('findit_user');
        localStorage.setItem('findit_user', JSON.stringify(user));
        sessionStorage.setItem('findit_user', JSON.stringify(user));
        sessionStorage.setItem('findit_toast', 'Account created successfully.');
        window.location.href = 'home.html';
      } catch (error) {
        showToast(error.message || 'Unable to connect to the server.', true);
      } finally {
        button.disabled = false;
      }
    });

    // Password visibility toggles
    document.querySelectorAll('.eye-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id    = btn.dataset.target;
        const input = document.getElementById(id);
        const show  = btn.querySelector('.eye-show');
        const hide  = btn.querySelector('.eye-hide');
        const vis   = input.type === 'text';
        input.type = vis ? 'password' : 'text';
        show.style.display = vis ? '' : 'none';
        hide.style.display = vis ? 'none' : '';
      });
    });
  </script>
</body>
</html>
