<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>FindIt — Splash</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%; min-height: 100vh; overflow: hidden;
      background: #dfe6ef;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif;
      padding: 0;
      margin: 0;
    }

    .card {
      position: relative;
      width: min(100vw, 430px);
      height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563EB 45%, #14B8A6 100%);
      overflow: hidden;
      animation: card-in .7s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* ── Floating rings ── */
    .ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      pointer-events: none;
      animation: ring-pulse 3s ease-in-out infinite;
    }
    .ring-1 { width:100px; height:100px; left:8%;  top:8%;  animation-delay:0s;   animation-duration:3s;   }
    .ring-2 { width:160px; height:160px; left:55%; top:65%; animation-delay:.5s;  animation-duration:3.6s; }
    .ring-3 { width:220px; height:220px; left:75%; top:28%; animation-delay:1s;   animation-duration:4.2s; }
    .ring-4 { width:280px; height:280px; left:20%; top:58%; animation-delay:1.5s; animation-duration:4.8s; }
    .ring-5 { width:340px; height:340px; left:45%; top:12%; animation-delay:2s;   animation-duration:5.4s; }

    @keyframes ring-pulse {
      0%,100% { transform:scale(1); opacity:.4; }
      50%      { transform:scale(1.15); opacity:.8; }
    }

    @keyframes card-in {
      from { transform:scale(.4); opacity:0; }
      to   { transform:scale(1); opacity:1; }
    }

    .logo-box {
      width: 112px; height: 112px; border-radius: 28px;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,.3);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      display: flex; align-items: center; justify-content: center;
    }

    .app-name {
      color: white; font-size: 30px; font-weight: 700;
      letter-spacing: -.5px;
      animation: fade-up .5s ease .45s both;
    }

    @keyframes fade-up {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Loading dots ── */
    .dots {
      display: flex; gap: 8px; margin-top: 8px;
      animation: fade-up .4s ease .9s both;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: white;
      animation: dot-blink 1s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay:.22s; }
    .dot:nth-child(3) { animation-delay:.44s; }

    @keyframes dot-blink {
      0%,100% { opacity:.3; }
      50%      { opacity:1; }
    }
  </style>
</head>
<body>
  <!-- Floating rings -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="ring ring-5"></div>

  <!-- Center content -->
  <div class="card">
    <div class="logo-box">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white"/>
        <circle cx="12" cy="9" r="2.5" fill="#14B8A6"/>
        <circle cx="17.2" cy="17.2" r="2.8" fill="none" stroke="white" stroke-width="1.6"/>
        <line x1="19.2" y1="19.2" x2="21" y2="21" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <p class="app-name">FindIt</p>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Auto-navigate after 2.6s
    setTimeout(() => { window.location.href = 'landing.html'; }, 2600);
  </script>
</body>
</html>
