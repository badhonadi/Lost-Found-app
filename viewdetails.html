<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>FindIt — View Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#F8FAFC; --card:#fff; --text:#0F172A; --muted:#64748B; --input:#F1F5F9; --line:#E2E8F0; --blue:#2563EB; }
    body.dark { --bg:#0F172A; --card:#1E293B; --text:#F1F5F9; --muted:#94A3B8; --input:#1E293B; --line:#1E293B; }
    html, body { min-height:100%; font-family:'Inter', sans-serif; }
    body { min-height:100dvh; background:#dfe6ef; color:var(--text); display:flex; justify-content:center; }
    .screen { width:min(100vw,400px); min-height:100dvh; background:var(--bg); overflow-y:auto; scrollbar-width:none; position:relative; }
    .screen::-webkit-scrollbar { display:none; }
    @media (max-width:600px) { body { background:var(--bg); } .screen { width:100vw; } }
    .header { display:flex; align-items:center; gap:12px; padding:48px 20px 16px; }
    .back-btn { width:40px; height:40px; border:0; border-radius:16px; background:var(--input); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    h1 { font-family:'Poppins', sans-serif; font-size:20px; font-weight:700; }
    .content { padding:0 20px 32px; }
    .hero { width:100%; height:220px; object-fit:cover; border-radius:16px; background:#E2E8F0; display:block; }
    .type-row { display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; }
    .lost { color:#DC2626; background:#FEF2F2; } .found { color:#059669; background:#ECFDF5; }
    .status { color:#2563EB; background:#EFF6FF; }
    .resolved { color:#16A34A; background:#F0FDF4; }
    .pending { color:#D97706; background:#FFFBEB; }
    h2 { margin-top:10px; font-family:'Poppins', sans-serif; font-size:21px; font-weight:700; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
    .info { padding:13px; border-radius:16px; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.07); }
    .label { color:var(--muted); font-size:11px; margin-bottom:5px; } .value { font-size:13px; font-weight:600; }
    .section { margin-top:12px; padding:16px; border-radius:16px; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.07); }
    .section h3 { font-family:'Poppins', sans-serif; font-size:14px; font-weight:700; margin-bottom:8px; } .description { color:var(--text); font-size:13px; line-height:1.6; }
    .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .action-btn { width:100%; padding:13px 8px; border:1px solid var(--blue); border-radius:14px; background:var(--card); color:var(--blue); font-family:'Poppins', sans-serif; font-weight:600; font-size:12px; cursor:pointer; transition:all 0.15s ease; }
    .action-btn:disabled { opacity:0.55; cursor:not-allowed; border-color:var(--muted); color:var(--muted); }
    .action-btn.claim { background:var(--blue); color:#fff; }
    .action-btn.claim:disabled { background:var(--muted); border-color:var(--muted); }
    .action-btn.locked { background:var(--input); color:var(--muted); border-color:var(--border); }
    .contact-panel { display:none; margin-top:10px; padding:14px; border-radius:14px; background:var(--input); }
    .contact-panel textarea { width:100%; min-height:76px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:12px 'Inter', sans-serif; resize:vertical; outline:none; }
    .contact-submit { margin-top:8px; padding:10px 14px; border:0; border-radius:10px; background:var(--blue); color:#fff; font:600 12px 'Poppins', sans-serif; cursor:pointer; }
    .contact-status { margin-top:8px; color:var(--muted); font-size:11px; }
    .primary { width:100%; margin-top:16px; padding:14px; border:0; border-radius:16px; background:linear-gradient(135deg,#2563EB,#14B8A6); color:#fff; font-family:'Poppins', sans-serif; font-weight:600; font-size:14px; cursor:pointer; box-shadow:0 4px 14px rgba(37,99,235,.3); }
    .message { padding:40px 10px; text-align:center; color:var(--muted); font-size:14px; }

    /* Modal styles */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.72); z-index: 9999;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      width: min(100vw - 32px, 390px); max-height: 85vh; background: var(--bg);
      border-radius: 24px; overflow-y: auto; padding: 20px; box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; gap: 14px;
    }
    .quiz-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    }
    .quiz-q-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .quiz-opt-lbl {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px;
      background: var(--input); margin-bottom: 6px; cursor: pointer; font-size: 12px; color: var(--text);
    }
    .quiz-opt-lbl:hover { background: rgba(37,99,235,0.08); }
    .quiz-opt-lbl input { accent-color: var(--blue); }
  </style>
</head>
<body>
  <main class="screen">
    <header class="header">
      <button class="back-btn" type="button" onclick="goBack()" aria-label="Go back">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="color:var(--text)">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
      </button>
      <h1>View Details</h1>
    </header>
    <section class="content" id="content"><p class="message">Loading post...</p></section>
  </main>

  <!-- Owner Verification Quiz Modal -->
  <div class="modal-overlay" id="quiz-modal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-family:'Poppins',sans-serif; font-size:16px; font-weight:700; color:var(--text);">Item Verification Quiz</h3>
        <button type="button" onclick="closeQuizModal()" style="background:var(--input); border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text);">✕</button>
      </div>
      <p style="font-size:11.5px; color:var(--muted); line-height:1.45;">The finder added verification question(s). You must answer correctly to verify this item belongs to you. <strong style="color:#EF4444;">Note: You only get 1 attempt!</strong></p>
      <div id="quiz-questions-list" style="display:flex; flex-direction:column; gap:12px;"></div>
      <button type="button" id="quiz-submit-btn" onclick="submitQuizAnswers()" style="width:100%; padding:13px; border:none; border-radius:14px; background:linear-gradient(135deg, #10B981, #059669); color:white; font-family:'Poppins',sans-serif; font-size:13.5px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(16,185,129,0.3);">Submit Answers & Claim</button>
    </div>
  </div>

  <!-- Wrong Answers Popup Modal -->
  <div class="modal-overlay" id="wrong-modal">
    <div class="modal-box" style="text-align:center; padding:24px 20px;">
      <div style="width:56px; height:56px; border-radius:50%; background:#FEF2F2; color:#DC2626; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:26px;">⚠️</div>
      <h3 style="font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; color:#DC2626; margin-bottom:8px;">Verification Failed</h3>
      <p style="font-size:14px; color:var(--text); font-weight:600; line-height:1.5; margin-bottom:20px;">your answers are wrong the item or product is not yours</p>
      <button type="button" onclick="closeWrongModal()" style="width:100%; padding:12px; border:none; border-radius:12px; background:#DC2626; color:white; font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">Close</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem('findit_dark') === 'true') document.body.classList.add('dark');

    const query = new URLSearchParams(location.search);
    const reportId = query.get('id');
    const returnPage = query.get('from') === 'search' ? 'search.html' : (query.get('from') === 'smart-match' ? 'smart-match.html' : 'my-posts.html');
    const content = document.getElementById('content');
    let selectedReport = null;
    let selectedReportType = null;
    let reportUserClaim = null;

    function goBack() {
      location.href = returnPage;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
    }

    function formatDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    }

    function getStoredUser() {
      return JSON.parse(localStorage.getItem('findit_user') || sessionStorage.getItem('findit_user') || 'null');
    }

    function openContactPanel(action) {
      const user = getStoredUser();
      if (!user || !user.id) {
        alert('Please log in first.');
        location.href = 'login.html';
        return;
      }

      if (action === 'message' && selectedReportType === 'found') {
        const isOwner = selectedReport && String(selectedReport.userId) === String(user.id);
        const hasValidClaim = reportUserClaim && reportUserClaim.passedVerification && reportUserClaim.status !== 'rejected';
        if (!isOwner && !hasValidClaim) {
          alert('You can only message the finder after successfully claiming this item.');
          return;
        }
      }

      const panel = document.getElementById('contact-panel');
      const input = document.getElementById('contact-message');
      const isClaim = action === 'claim';
      document.getElementById('contact-title').textContent = isClaim ? 'Why does this item belong to you?' : 'Write a message to the finder';
      input.placeholder = isClaim ? 'Add details that can prove ownership...' : 'Write your message...';
      document.getElementById('contact-action').value = action;
      panel.style.display = 'block';
      input.focus();
    }

    async function submitContact() {
      const user = getStoredUser();
      const action = document.getElementById('contact-action').value;
      const message = document.getElementById('contact-message').value.trim();
      const status = document.getElementById('contact-status');
      if (!user || !user.id) { status.textContent = 'Please log in first.'; return; }
      if (action === 'message' && !message) { status.textContent = 'Please write a message.'; return; }

      status.textContent = 'Sending...';
      try {
        const endpoint = action === 'claim' ? 'claims' : 'messages';
        const body = action === 'claim' ? { userId: user.id, message } : { userId: user.id, body: message };
        const response = await fetch(`${window.API_BASE_URL || ''}/api/reports/${encodeURIComponent(reportId)}/${endpoint}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to save.');
        if (action === 'claim') {
          sessionStorage.setItem('findit_toast', 'Claimed successfully');
          location.reload();
          return;
        }
        status.textContent = 'Message sent successfully.';
        document.getElementById('contact-message').value = '';
      } catch (error) {
        status.textContent = error.message || 'Unable to save right now.';
      }
    }

    function render(report, type, isOwnerOrAdmin, userClaim) {
      selectedReport = report;
      selectedReportType = type;
      reportUserClaim = userClaim;

      const user = getStoredUser();
      const isOwner = user && user.id && String(report.userId) === String(user.id);
      const status = report.status === 'resolved' ? 'resolved' : (report.status || 'open');
      const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
      const typeLabel = type === 'lost' ? 'Lost' : 'Found';
      const image = report.photos && report.photos[0] ? report.photos[0] : '';

      // Determine claim & message state
      let claimButtonHtml = '';
      let messageButtonHtml = '';
      let claimNoticeHtml = '';

      if (type === 'found' && !isOwner) {
        if (userClaim) {
          if (userClaim.passedVerification === false) {
            claimNoticeHtml = `<div style="margin-top:14px; padding:12px; border-radius:12px; background:#FEF2F2; color:#DC2626; font-size:12px; font-weight:600; text-align:center;">⚠️ Your verification attempt failed. You cannot claim this item.</div>`;
            claimButtonHtml = `<button class="action-btn locked" type="button" disabled>Claim Attempt Failed</button>`;
            messageButtonHtml = `<button class="action-btn locked" type="button" onclick="alert('You can only message the finder after successfully claiming this item.')">Messaging Locked</button>`;
          } else {
            claimNoticeHtml = `<div style="margin-top:14px; padding:12px; border-radius:12px; background:#ECFDF5; color:#059669; font-size:12px; font-weight:600; text-align:center;">✅ Claim request submitted (${userClaim.status || 'Pending'}).</div>`;
            claimButtonHtml = `<button class="action-btn" style="border-color:#10B981; color:#059669;" type="button" disabled>Claim Submitted</button>`;
            messageButtonHtml = `<button class="action-btn" type="button" onclick="openContactPanel('message')">Message Finder</button>`;
          }
        } else {
          claimButtonHtml = `<button class="action-btn claim" type="button" onclick="initiateClaim()">Claim This Item</button>`;
          messageButtonHtml = `<button class="action-btn locked" type="button" onclick="alert('You can only message the finder after successfully claiming this item.')">Message Finder</button>`;
        }
      }

      // Private photo card (if present and user is owner or admin)
      let privatePhotoHtml = '';
      if (report.privatePhoto) {
        privatePhotoHtml = `
          <div class="section" style="border: 1.5px dashed #2563EB;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
              <h3 style="margin:0; color:#2563EB; display:flex; align-items:center; gap:6px; font-size:13px;">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Private Image
              </h3>
              <span style="font-size:10px; font-weight:700; color:#2563EB; background:rgba(37,99,235,0.12); padding:2px 8px; border-radius:99px;">Visible only to you & admin</span>
            </div>
            <img src="${escapeHtml(report.privatePhoto)}" style="width:100%; max-height:220px; object-fit:cover; border-radius:12px;" alt="Private Image">
          </div>`;
      }

      content.innerHTML = `
        <img class="hero" src="${escapeHtml(image)}" alt="${escapeHtml(report.itemName)}" onerror="this.style.display='none'">
        <div class="type-row"><span class="badge ${type}">${typeLabel}</span><span class="badge ${status}">${statusLabel}</span></div>
        <h2>${escapeHtml(report.itemName)}</h2>
        <div class="info-grid">
          <div class="info"><div class="label">Category</div><div class="value">${escapeHtml(report.category)}</div></div>
          <div class="info"><div class="label">Posted</div><div class="value">${formatDate(report.createdAt)}</div></div>
          <div class="info"><div class="label">Location</div><div class="value">${escapeHtml(report.location)}</div></div>
          <div class="info"><div class="label">Contact</div><div class="value">${escapeHtml(report.contactMethod)}</div></div>
        </div>
        <div class="section"><h3>Description</h3><p class="description">${escapeHtml(report.description) || 'No description available.'}</p></div>
        ${privatePhotoHtml}
        ${claimNoticeHtml}
        ${(type === 'found' && !isOwner) ? `<div class="action-grid">${messageButtonHtml}${claimButtonHtml}</div>
        <div class="contact-panel" id="contact-panel">
          <h3 id="contact-title">Write a message to the finder</h3>
          <textarea id="contact-message"></textarea>
          <input id="contact-action" type="hidden" value="message">
          <button class="contact-submit" type="button" onclick="submitContact()">Send</button>
          <p class="contact-status" id="contact-status"></p>
        </div>` : ''}
        <button class="primary" type="button" onclick="location.href='track-status.html?id=${encodeURIComponent(report._id)}'">Track Status</button>`;
    }

    function initiateClaim() {
      const user = getStoredUser();
      if (!user || !user.id) {
        alert('Please log in before claiming an item.');
        location.href = 'login.html';
        return;
      }

      if (reportUserClaim) {
        alert('You have already submitted a claim attempt for this item. Multiple attempts are not allowed.');
        return;
      }

      const questions = selectedReport.verificationQuestions || [];
      if (questions.length > 0) {
        // Open Quiz modal
        const list = document.getElementById('quiz-questions-list');
        list.innerHTML = '';
        questions.forEach((q, idx) => {
          const card = document.createElement('div');
          card.className = 'quiz-card';
          const optsHtml = (q.options || []).map((opt, optIdx) => `
            <label class="quiz-opt-lbl">
              <input type="radio" name="quiz_q_${idx}" value="${optIdx}">
              <span>${escapeHtml(opt)}</span>
            </label>
          `).join('');

          card.innerHTML = `
            <p class="quiz-q-title">${idx + 1}. ${escapeHtml(q.question)}</p>
            ${optsHtml}
          `;
          list.appendChild(card);
        });
        document.getElementById('quiz-modal').classList.add('show');
      } else {
        // Direct claim
        if (confirm('Are you sure you want to claim this item?')) {
          submitDirectClaim();
        }
      }
    }

    function closeQuizModal() {
      document.getElementById('quiz-modal').classList.remove('show');
    }

    function closeWrongModal() {
      document.getElementById('wrong-modal').classList.remove('show');
      location.reload();
    }

    async function submitQuizAnswers() {
      const user = getStoredUser();
      if (!user || !user.id) return;
      const questions = selectedReport.verificationQuestions || [];
      const answers = [];

      for (let i = 0; i < questions.length; i++) {
        const sel = document.querySelector(`input[name="quiz_q_${i}"]:checked`);
        if (!sel) {
          alert(`Please answer question ${i + 1}.`);
          return;
        }
        answers.push(Number(sel.value));
      }

      const submitBtn = document.getElementById('quiz-submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying answers...';

      try {
        const response = await fetch(`${window.API_BASE_URL || ''}/api/reports/${encodeURIComponent(reportId)}/claims`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id, answers })
        });
        const result = await response.json();
        closeQuizModal();

        if (!response.ok) {
          // If answers are wrong or claim rejected
          if (result.message && result.message.toLowerCase().includes('wrong')) {
            document.getElementById('wrong-modal').classList.add('show');
          } else {
            alert(result.message || 'Unable to submit claim.');
            location.reload();
          }
          return;
        }

        alert('Claim submitted successfully! You can now send messages to the finder.');
        location.reload();
      } catch (error) {
        alert(error.message || 'Server error during verification.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Answers & Claim';
      }
    }

    async function submitDirectClaim() {
      const user = getStoredUser();
      if (!user || !user.id) return;
      try {
        const response = await fetch(`${window.API_BASE_URL || ''}/api/reports/${encodeURIComponent(reportId)}/claims`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: user.id })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to submit claim.');
        alert('Claim submitted successfully! You can now message the finder.');
        location.reload();
      } catch (error) {
        alert(error.message || 'Unable to submit claim right now.');
      }
    }

    async function loadReport() {
      if (!reportId) { content.innerHTML = '<p class="message">Post not found.</p>'; return; }
      try {
        const user = getStoredUser();
        const userParam = user && user.id ? `?userId=${encodeURIComponent(user.id)}` : '';
        const response = await fetch(`${window.API_BASE_URL || ''}/api/reports/${encodeURIComponent(reportId)}${userParam}`);
        const result = await response.json();
        if (!response.ok || !result.report) throw new Error(result.message || 'Unable to load post.');
        render(result.report, result.type, result.isOwnerOrAdmin, result.userClaim);
      } catch (error) {
        content.innerHTML = `<p class="message">${escapeHtml(error.message || 'Unable to load post.')}</p>`;
      }
    }

    loadReport();
  </script>
</body>
</html>
