<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>FindIt — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F8FAFC;
      --cb:     #ffffff;
      --ib:     #F1F5F9;
      --tc:     #0F172A;
      --mc:     #64748B;
      --border: #E2E8F0;
      --primary:#2563EB;
    }
    body.dark {
      --bg:     #0F172A;
      --cb:     #1E293B;
      --ib:     #1E293B;
      --tc:     #F1F5F9;
      --mc:     #94A3B8;
      --border: #1E293B;
    }

    body {
      min-height: 100dvh; background: #dfe6ef;
      font-family: 'Inter', sans-serif; color: var(--tc);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    /* ── Scrollable wrapper ── */
    .page {
      width: min(100vw, 430px);
      min-height: 100dvh;
      padding: 0 20px 40px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      margin: 0 auto;
    }

    /* ── Header area ── */
    .header { padding-top: 48px; padding-bottom: 16px; }

    .back-btn {
      width: 40px; height: 40px; border-radius: 16px;
      background: var(--ib); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; transition: opacity .15s;
    }
    .back-btn:active { opacity: .7; }
    .back-btn svg { color: var(--tc); }

    /* ── Logo ── */
    .logo-row {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-mark {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #2563EB 0%, #14B8A6 100%);
      box-shadow: 0 4px 14px rgba(37,99,235,.35);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-text {
      font-family: 'Poppins', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--tc);
    }

    .screen-title {
      margin-top: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 24px; font-weight: 700;
      color: var(--tc);
    }
    .screen-sub {
      margin-top: 4px; font-size: 14px; color: var(--mc);
    }

    /* ── Form ── */
    .form { display: flex; flex-direction: column; gap: 16px; margin-top: 4px; }

    .field-label {
      display: block; font-size: 14px; font-weight: 500;
      color: var(--tc); margin-bottom: 6px;
    }

    .input-row {
      display: flex; align-items: center;
      background: var(--ib); border-radius: 16px;
      height: 52px; padding: 0 16px; gap: 12px;
    }
    .input-row input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 14px; color: var(--tc); font-family: 'Inter', sans-serif;
    }
    .input-row input::placeholder { color: var(--mc); }
    .input-row svg { flex-shrink: 0; color: var(--mc); }

    .eye-btn {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--mc); padding: 4px;
    }

    /* ── Remember / Forgot ── */
    .row-between {
      display: flex; align-items: center; justify-content: space-between;
    }

    .remember-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--mc); cursor: pointer;
    }

    .checkbox-custom {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid var(--mc); display: flex;
      align-items: center; justify-content: center;
      transition: all .15s; flex-shrink: 0;
      cursor: pointer;
    }
    .checkbox-custom.checked {
      background: var(--primary); border-color: var(--primary);
    }

    .forgot-btn {
      background: none; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; color: var(--primary);
    }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%; height: 52px; border-radius: 16px;
      background: linear-gradient(135deg, #2563EB, #1d4ed8);
      color: white; font-family: 'Poppins', sans-serif;
      font-size: 15px; font-weight: 600; border: none; cursor: pointer;
      box-shadow: 0 4px 18px rgba(37,99,235,.38);
      transition: transform .15s, box-shadow .15s;
      margin-top: 4px;
    }
    .btn-primary:active { transform: scale(.97); box-shadow: 0 2px 10px rgba(37,99,235,.3); }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12px; color: var(--mc); white-space: nowrap; }

    /* ── Social buttons ── */
    .social-row { display: flex; gap: 12px; }

    .social-btn {
      flex: 1; height: 48px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); background: var(--cb);
      cursor: pointer; font-size: 12px; font-weight: 500;
      color: var(--mc); font-family: 'Inter', sans-serif;
      transition: opacity .15s;
    }
    .social-btn:active { opacity: .75; }
    .social-initial { font-size: 14px; font-weight: 700; }

    /* ── Switch link ── */
    .switch-text {
      text-align: center; font-size: 14px; color: var(--mc);
    }
    .switch-text a {
      color: var(--primary); font-weight: 600; text-decoration: none;
    }

    .toast {
      position: fixed; top: 20px; left: 50%; z-index: 10;
      width: min(calc(100% - 32px), 398px); padding: 14px 18px;
      border-radius: 14px; color: white; background: #172018;
      box-shadow: 0 8px 24px rgba(15,23,42,.22);
      font-size: 14px; text-align: center;
      transform: translate(-50%, -140%); opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: #991B1B; }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="page">
    <div class="header">
      <button class="back-btn" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
        </svg>
      </button>

      <div class="logo-row">
        <div class="logo-mark">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white" fill-opacity=".9"/>
            <circle cx="12" cy="9" r="2.5" fill="#14B8A6"/>
            <circle cx="17.2" cy="17.2" r="2.8" fill="none" stroke="white" stroke-width="1.6"/>
            <line x1="19.2" y1="19.2" x2="21" y2="21" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">FindIt</span>
      </div>

      <h2 class="screen-title">Login</h2>
      <p class="screen-sub">Welcome back — we missed you.</p>
    </div>

    <div class="form">
      <!-- Email -->
      <div>
        <label class="field-label">Email Address</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
          </svg>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="field-label">Password</label>
        <div class="input-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="pw-input" placeholder="••••••••" autocomplete="current-password">
          <button class="eye-btn" id="eye-btn" type="button">
            <!-- Eye icon (hidden state) -->
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember / Forgot -->
      <div class="row-between">
        <label class="remember-label">
          <div class="checkbox-custom" id="remember-box"></div>
          <span>Remember Me</span>
        </label>
        <button class="forgot-btn">Forgot Password?</button>
      </div>

      <!-- Login button -->
      <button class="btn-primary" id="login-button" type="button">Login</button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Or continue with</span>
        <div class="divider-line"></div>
      </div>

      <!-- Social buttons -->
      <div class="social-row">
        <button class="social-btn" type="button" onclick="showToast('Social login is not configured yet.', true)">
          <span class="social-initial" style="color:#EA4335">G</span>
          <span>Google</span>
        </button>
        <button class="social-btn" type="button" onclick="showToast('Social login is not configured yet.', true)">
          <span class="social-initial" style="color:#000">A</span>
          <span>Apple</span>
        </button>
        <button class="social-btn" type="button" onclick="showToast('Social login is not configured yet.', true)">
          <span class="social-initial" style="color:#1877F2">F</span>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Switch to signup -->
      <p class="switch-text">
        Don't have an account? <a href="signup.html">Create Account</a>
      </p>
    </div>
  </div>

  <script>
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Password visibility toggle
    const pwInput  = document.getElementById('pw-input');
    const eyeBtn   = document.getElementById('eye-btn');
    const eyeOpen  = document.getElementById('eye-open');
    const eyeClosed= document.getElementById('eye-closed');
    let pwVisible  = false;
    eyeBtn.addEventListener('click', () => {
      pwVisible = !pwVisible;
      pwInput.type = pwVisible ? 'text' : 'password';
      eyeOpen.style.display  = pwVisible ? 'none' : '';
      eyeClosed.style.display= pwVisible ? '' : 'none';
    });

    // Remember me checkbox
    const rememberBox = document.getElementById('remember-box');
    let remembered = false;
    rememberBox.addEventListener('click', () => {
      remembered = !remembered;
      rememberBox.classList.toggle('checked', remembered);
      rememberBox.innerHTML = remembered
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        : '';
    });

    // Dark mode from localStorage
    if (localStorage.getItem('findit_dark') === 'true') document.body.classList.add('dark');

    async function performLogin() {
      const button = document.getElementById('login-button');
      const payload = {
        email: document.getElementById('login-email').value.trim(),
        password: pwInput.value
      };

      if (!payload.email || !payload.password) {
        showToast('Invalid email/password.', true);
        return;
      }

      button.disabled = true;
      try {
        const baseUrl = window.API_BASE_URL || '';
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Invalid email/password.');

        const user = result.user;
        if (result.suspended || result.banned) {
          localStorage.setItem('findit_user', JSON.stringify(user));
          sessionStorage.setItem('findit_user', JSON.stringify(user));
          window.location.href = result.redirectUrl || 'account-suspended.html';
          return;
        }
        if (result.requiresOtp || (user && user.role === 'admin') || payload.email.toLowerCase() === 'admin@gmail.com') {
          sessionStorage.setItem('findit_admin_email', payload.email);
          sessionStorage.setItem('findit_admin_pw', payload.password);
          localStorage.setItem('findit_admin_email', payload.email);
          if (user) {
            localStorage.setItem('findit_user', JSON.stringify(user));
            sessionStorage.setItem('findit_user', JSON.stringify(user));
          }
          window.location.href = result.redirectUrl || 'findit_otp.html';
          return;
        }

        localStorage.setItem('findit_user', JSON.stringify(user));
        sessionStorage.setItem('findit_user', JSON.stringify(user));
        sessionStorage.setItem('findit_toast', 'Login successful.');
        window.location.href = 'home.html';
      } catch (error) {
        if (payload.email.toLowerCase() === 'admin@gmail.com' && payload.password === '123456') {
          sessionStorage.setItem('findit_admin_email', payload.email);
          sessionStorage.setItem('findit_admin_pw', payload.password);
          localStorage.setItem('findit_admin_email', payload.email);
          window.location.href = 'findit_otp.html';
          return;
        }
        showToast(error.message || 'Unable to connect to the server. Make sure node server.js is running.', true);
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('login-button').addEventListener('click', performLogin);
    pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performLogin(); });
    document.getElementById('login-email').addEventListener('keydown', (e) => { if (e.key === 'Enter') performLogin(); });
  </script>
</body>
</html>
