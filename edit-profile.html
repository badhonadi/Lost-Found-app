<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>FindIt — Edit Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F8FAFC;
      --cb:      #FFFFFF;
      --ib:      #F1F5F9;
      --tc:      #0F172A;
      --mc:      #64748B;
      --border:  #E2E8F0;
      --primary: #2563EB;
      --accent:  #14B8A6;
      --disabled:#CBD5E1;
      --shell:   #dfe6ef;
    }
    body.dark {
      --bg:      #0F172A;
      --cb:      #1E293B;
      --ib:      #1E293B;
      --tc:      #F1F5F9;
      --mc:      #94A3B8;
      --border:  #334155;
      --disabled:#475569;
      --shell:   #0b1220;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--shell);
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex; align-items: center; justify-content: center;
    }

    .phone-shell {
      width: min(100vw, 400px);
      height: 100dvh; max-height: 100dvh;
      background: var(--bg);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      position: relative;
      display: flex; flex-direction: column;
    }

    @media (max-width: 600px) {
      body { background: var(--bg); }
      .phone-shell {
        width: 100vw;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── Scroll container ── */
    .scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      padding-bottom: 40px;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* ── Top Header ── */
    .header {
      padding: 24px 20px 16px;
      background: var(--bg);
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--border);
    }
    .header-row {
      display: flex; align-items: center; gap: 12px;
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 14px;
      background: var(--ib); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--tc);
      transition: background .15s;
    }
    .back-btn:active { opacity: .7; }
    .header-title-wrap { flex: 1; }
    .screen-title {
      font-family: 'Poppins', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--tc); line-height: 1.2;
    }
    .screen-sub {
      font-size: 12px; color: var(--mc); margin-top: 2px;
    }

    /* ── Content Body ── */
    .content {
      padding: 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* ── Profile Summary Header Card ── */
    .profile-card {
      background: var(--cb);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      position: relative;
      border: 1px solid var(--border);
    }

    .avatar-wrapper {
      position: relative; margin-bottom: 12px;
    }
    .avatar-img {
      width: 88px; height: 88px; border-radius: 24px;
      object-fit: cover; display: block;
      border: 3px solid var(--primary);
      background: var(--ib);
    }
    .avatar-change-btn {
      position: absolute; bottom: -4px; right: -4px;
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--primary); color: white;
      border: 2px solid var(--cb); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(37,99,235,.4);
    }
    .avatar-change-btn input[type=file] { display: none; }

    .summary-name {
      font-family: 'Poppins', sans-serif;
      font-size: 18px; font-weight: 700; color: var(--tc);
    }
    .summary-email {
      font-size: 13px; color: var(--mc); margin-top: 2px; font-weight: 500;
    }
    .badge-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      background: rgba(37, 99, 235, 0.1); color: var(--primary);
    }
    .gender-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      background: rgba(20, 184, 166, 0.1); color: var(--accent);
      text-transform: capitalize;
    }

    /* ── Stats Grid ── */
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 15px; font-weight: 700; color: var(--tc);
      display: flex; align-items: center; gap: 8px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-card {
      background: var(--cb);
      border-radius: 16px; padding: 14px 10px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,.03);
    }
    .stat-val {
      font-family: 'Poppins', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--tc);
    }
    .stat-label {
      font-size: 11px; color: var(--mc); margin-top: 2px; font-weight: 500;
    }

    /* ── Form Section ── */
    .form-card {
      background: var(--cb);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
      display: flex; flex-direction: column; gap: 16px;
    }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 13px; font-weight: 600; color: var(--tc);
      display: flex; align-items: center; justify-content: space-between;
    }
    .readonly-tag {
      font-size: 10px; font-weight: 600;
      color: #EF4444; background: rgba(239,68,68,.1);
      padding: 2px 6px; border-radius: 6px;
      display: flex; align-items: center; gap: 3px;
    }

    .input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: var(--ib); height: 50px;
      border-radius: 14px; padding: 0 14px;
      border: 1.5px solid transparent;
      transition: border-color .15s;
    }
    .input-wrap:focus-within {
      border-color: var(--primary);
    }
    .input-wrap.disabled {
      background: var(--ib); opacity: 0.75;
      cursor: not-allowed; border: 1.5px solid var(--border);
    }
    .input-wrap svg { flex-shrink: 0; color: var(--mc); }
    .input-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 14px; color: var(--tc); font-family: 'Inter', sans-serif;
      min-width: 0;
    }
    .input-wrap input:disabled {
      color: var(--mc); cursor: not-allowed;
    }

    .eye-btn {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; color: var(--mc);
      padding: 4px;
    }

    /* ── Submit Button ── */
    .save-btn {
      width: 100%; height: 52px; border-radius: 16px;
      background: linear-gradient(135deg, #2563EB, #14B8A6);
      color: white; font-family: 'Poppins', sans-serif;
      font-size: 15px; font-weight: 600; border: none; cursor: pointer;
      box-shadow: 0 4px 18px rgba(37,99,235,.35);
      transition: transform .15s, opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .save-btn:active { transform: scale(.98); }
    .save-btn:disabled { opacity: .65; cursor: wait; }

    /* ── Toast ── */
    .toast {
      position: fixed; top: 20px; left: 50%; z-index: 100;
      width: min(calc(100% - 32px), 360px); padding: 14px 18px;
      border-radius: 14px; color: white; background: #0F172A;
      box-shadow: 0 8px 24px rgba(15,23,42,.25);
      font-size: 13.5px; font-weight: 500; text-align: center;
      transform: translate(-50%, -140%); opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
      pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: #991B1B; }
    .toast.success { background: #059669; }
  </style>
</head>
<body>

  <div class="toast" id="toast" role="status"></div>

  <div class="phone-shell">

    <!-- Top Header -->
    <div class="header">
      <div class="header-row">
        <button class="back-btn" onclick="location.href='profile.html'" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
          </svg>
        </button>
        <div class="header-title-wrap">
          <h1 class="screen-title">Edit Profile</h1>
          <p class="screen-sub">Update your account information</p>
        </div>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="scroll-area">
      <div class="content">

        <!-- User Summary Card -->
        <div class="profile-card">
          <div class="avatar-wrapper">
            <img class="avatar-img" id="profile-avatar-preview" src="" alt="Profile Avatar">
            <label class="avatar-change-btn" title="Change Avatar Photo">
              <input type="file" id="avatar-file-input" accept="image/*">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </label>
          </div>
          <h2 class="summary-name" id="summary-name">User Name</h2>
          <p class="summary-email" id="summary-email">user@example.com</p>
          <div class="badge-row">
            <span class="status-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              Verified Member
            </span>
            <span class="gender-badge" id="gender-badge-text">Gender: Male</span>
          </div>
        </div>

        <!-- User Statistics Section -->
        <div>
          <div class="section-title" style="margin-bottom: 10px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            Your Activity Stats
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-val" id="stat-posted">0</div>
              <div class="stat-label">Posted Reports</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" id="stat-solved">0</div>
              <div class="stat-label">Solved Reports</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" id="stat-reputation">100%</div>
              <div class="stat-label">Trust Score</div>
            </div>
          </div>
        </div>

        <!-- Editable Form -->
        <form class="form-card" id="profile-edit-form">
          <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            Personal Credentials
          </div>

          <!-- Full Name (Editable) -->
          <div class="field-group">
            <label class="field-label" for="full-name">Full Name</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="full-name" required placeholder="Enter full name" autocomplete="name">
            </div>
          </div>

          <!-- Phone Number (Editable) -->
          <div class="field-group">
            <label class="field-label" for="phone">Mobile Number</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.36 12 19.79 19.79 0 0 1 1.27 3.49 2 2 0 0 1 3.24 1.27h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              <input type="tel" id="phone" required placeholder="Enter phone number" autocomplete="tel">
            </div>
          </div>

          <!-- Email (Read-only / Cannot be changed) -->
          <div class="field-group">
            <div class="field-label">
              <span>Email Address</span>
              <span class="readonly-tag">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Locked
              </span>
            </div>
            <div class="input-wrap disabled" title="Email address cannot be changed">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
              </svg>
              <input type="email" id="email" disabled placeholder="Registered Email">
            </div>
          </div>

          <!-- Gender (Read-only / Cannot be changed) -->
          <div class="field-group">
            <div class="field-label">
              <span>Gender</span>
              <span class="readonly-tag">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Locked
              </span>
            </div>
            <div class="input-wrap disabled" title="Gender cannot be changed">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M5 21c.7-3.3 3.1-5 7-5s6.3 1.7 7 5"/>
              </svg>
              <input type="text" id="gender" disabled placeholder="Gender">
            </div>
          </div>

          <!-- Password Update Section -->
          <div class="section-title" style="margin-top: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Change Password (Optional)
          </div>

          <div class="field-group">
            <label class="field-label" for="pw1">New Password</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="pw1" placeholder="Min. 8 characters" autocomplete="new-password">
              <button class="eye-btn" type="button" data-target="pw1" aria-label="Toggle password visibility">
                <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="pw2">Confirm New Password</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="pw2" placeholder="Re-enter new password" autocomplete="new-password">
              <button class="eye-btn" type="button" data-target="pw2" aria-label="Toggle password visibility">
                <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <!-- Save Button -->
          <button class="save-btn" id="save-btn" type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            Save Changes
          </button>
        </form>

      </div>
    </div>

  </div>

  <script>
    // Dark mode support
    if (localStorage.getItem('findit_dark') === 'true') document.body.classList.add('dark');

    let currentUser = null;
    let newAvatarData = null;

    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function defaultAvatar(gender) {
      const femaleStyle = gender === 'female' || gender === 'others';
      const skin = femaleStyle ? '#F2C7A5' : '#D9A77A';
      const shirt = femaleStyle ? '#E11D48' : '#2563EB';
      const hair = femaleStyle ? '#7C2D12' : '#334155';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="#E2E8F0"/><path d="M19 96c2-22 15-32 29-32s27 10 29 32" fill="${shirt}"/><circle cx="48" cy="40" r="20" fill="${skin}"/><path d="M28 39c0-18 9-27 21-27 14 0 22 10 20 27-5-8-12-12-21-12-7 0-13 4-20 12z" fill="${hair}"/><circle cx="40" cy="42" r="2" fill="#334155"/><circle cx="56" cy="42" r="2" fill="#334155"/><path d="M43 51c3 2 7 2 10 0" fill="none" stroke="#9A5B45" stroke-width="2" stroke-linecap="round"/></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    function renderUserData(user) {
      currentUser = user;
      document.getElementById('summary-name').textContent = user.fullName || 'User Name';
      document.getElementById('summary-email').textContent = user.email || 'no-email@findit.com';
      document.getElementById('gender-badge-text').textContent = `Gender: ${user.gender ? (user.gender.charAt(0).toUpperCase() + user.gender.slice(1)) : 'Others'}`;

      // Form inputs
      document.getElementById('full-name').value = user.fullName || '';
      document.getElementById('phone').value = user.phone || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('gender').value = user.gender ? (user.gender.charAt(0).toUpperCase() + user.gender.slice(1)) : 'Others';

      // Avatar
      const avatarImg = document.getElementById('profile-avatar-preview');
      const fallback = defaultAvatar(user.gender);
      avatarImg.onerror = () => {
        avatarImg.onerror = null;
        avatarImg.src = fallback;
      };
      avatarImg.src = user.avatar || fallback;
    }

    async function loadUserData() {
      const storedUser = JSON.parse(localStorage.getItem('findit_user') || sessionStorage.getItem('findit_user') || 'null');
      if (!storedUser || !storedUser.id) return location.replace('login.html');

      try {
        const baseUrl = window.API_BASE_URL || '';
        const response = await fetch(`${baseUrl}/api/users/${storedUser.id}`);
        if (!response.ok) throw new Error();
        const result = await response.json();
        localStorage.setItem('findit_user', JSON.stringify(result.user));
        sessionStorage.setItem('findit_user', JSON.stringify(result.user));
        renderUserData(result.user);
      } catch (err) {
        // Fallback to local storage user
        renderUserData(storedUser);
      }
    }

    // Avatar upload handler
    document.getElementById('avatar-file-input').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        newAvatarData = e.target.result;
        document.getElementById('profile-avatar-preview').src = newAvatarData;
        showToast('Photo selected! Click Save Changes to apply.', 'success');
      };
      reader.readAsDataURL(file);
      this.value = '';
    });

    // Password Eye toggle
    document.querySelectorAll('.eye-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        const show = btn.querySelector('.eye-show');
        const hide = btn.querySelector('.eye-hide');
        const isText = input.type === 'text';
        input.type = isText ? 'password' : 'text';
        show.style.display = isText ? '' : 'none';
        hide.style.display = isText ? 'none' : '';
      });
    });

    // Form Submit
    document.getElementById('profile-edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser || !currentUser.id) return;

      const saveBtn = document.getElementById('save-btn');
      const fullName = document.getElementById('full-name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;

      if (!fullName || !phone) {
        showToast('Full Name and Phone Number are required.', 'error');
        return;
      }

      if (pw1 || pw2) {
        if (pw1.length < 8) {
          showToast('New password must be at least 8 characters.', 'error');
          return;
        }
        if (pw1 !== pw2) {
          showToast('Passwords do not match.', 'error');
          return;
        }
      }

      const payload = { fullName, phone };
      if (newAvatarData) payload.avatar = newAvatarData;
      if (pw1) payload.password = pw1;

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const baseUrl = window.API_BASE_URL || '';
        const response = await fetch(`${baseUrl}/api/users/${currentUser.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to update profile.');

        // Update local session
        localStorage.setItem('findit_user', JSON.stringify(result.user));
        sessionStorage.setItem('findit_user', JSON.stringify(result.user));
        renderUserData(result.user);

        // Reset password fields
        document.getElementById('pw1').value = '';
        document.getElementById('pw2').value = '';
        newAvatarData = null;

        showToast('Profile updated successfully!', 'success');
      } catch (err) {
        showToast(err.message || 'Failed to update profile.', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Changes`;
      }
    });

    loadUserData();
  </script>
</body>
</html>
